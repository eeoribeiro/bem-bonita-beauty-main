    <path d="M18 48V16h13c6.8 0 10.8 3 10.8 7.8 0 3.2-1.8 5.6-4.8 6.8 4 1 6 3.4 6 7 0 5-4 7.6-11.5 7.6H18Zm7.5-17.2h5c3.2 0 4.8-1.1 4.8-3.2 0-2-1.6-3-4.8-3H25.5v6.2Zm0 11h5.8c3.5 0 5.2-1.1 5.2-3.3 0-2.2-1.7-3.3-5.2-3.3H25.5v6.6Z" fill="url(#pinkGrad)"/>
