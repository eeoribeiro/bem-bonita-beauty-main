<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Logo Bem Bonita - Beleza e Cosméticos</title>
  <desc>Mascote de gata estilizada em contorno rosa ao lado do nome Bem Bonita em branco/preto com o subtítulo Beleza e Cosméticos em rosa</desc>

  <g id="gata" transform="translate(40,40)" fill="none" stroke="#e0489a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- corpo -->
    <path d="M40 210 C 20 190, 15 150, 30 120 C 45 90, 40 70, 55 55 C 70 40, 95 35, 115 45 C 135 55, 140 75, 135 95 C 165 100, 190 120, 195 150 C 200 175, 190 200, 170 215 C 150 228, 60 228, 40 210 Z" />
    <!-- orelha esquerda -->
    <path d="M60 55 L45 15 L85 45 Z" />
    <!-- orelha direita -->
    <path d="M110 45 L120 5 L150 40 Z" />
    <!-- cauda -->
    <path d="M195 150 C 230 140, 250 110, 240 75 C 232 48, 205 35, 185 45" />
    <!-- rosto: olho -->
    <path d="M95 85 C 100 78, 112 78, 116 85" stroke-width="5"/>
    <!-- nariz -->
    <path d="M100 100 C 103 97, 109 97, 112 100 C 109 105, 103 105, 100 100 Z" fill="#e0489a" stroke="none"/>
    <!-- bigodes -->
    <path d="M70 100 L30 92" stroke-width="3"/>
    <path d="M70 108 L28 108" stroke-width="3"/>
    <path d="M70 116 L30 124" stroke-width="3"/>
    <path d="M140 100 L180 92" stroke-width="3"/>
    <path d="M140 108 L182 108" stroke-width="3"/>
    <path d="M140 116 L180 124" stroke-width="3"/>
    <!-- pernas -->
    <path d="M60 215 L58 250" />
    <path d="M100 220 L100 255" />
    <path d="M150 218 L155 252" />
  </g>

  <g transform="translate(300,0)">
    <text x="0" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#1a1a1a">Bem</text>
    <text x="0" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#1a1a1a">Bonita</text>
    <text x="4" y="255" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#e0489a">BELEZA &amp; COSMÉTICOS</text>
  </g>
</svg>
